name: CI
on:
  push:
    branches: [stackline]
  pull_request:
    branches: [stackline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: npm test
      - run: npm run test:package
      - run: node --test scripts/registry-requests.test.mjs
      - run: npm audit --audit-level=low
      - run: git diff --exit-code
      - name: Pack tested source
        run: mkdir artifact && npm pack --ignore-scripts --pack-destination artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
      - name: Check retained Node 4 runtime compatibility
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 4.9.1
          package-manager-cache: false
      - run: STACKLINE_TEST_PACKAGE="$PWD/.package-consumer/node_modules/@stackline/setimmediate" node test/stackline.cjs
